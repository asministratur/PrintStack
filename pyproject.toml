[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printstack"
version = "1.0.0"
description = "Windows desktop utility for queuing, previewing, and batch-printing PDF, Word, and image files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "asministratur", email = "asministratur@gmail.com" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pywin32>=306",
    "PyMuPDF>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "ruff>=0.8.0",
    "pyinstaller>=6.10.0",
]

[project.scripts]
printstack-shortcuts = "printstack.desktop_integration:cli_install"

[project.gui-scripts]
printstack = "printstack.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
printstack = ["ui/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
